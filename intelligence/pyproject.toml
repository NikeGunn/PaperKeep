[project]
name = "scanvault-intelligence"
version = "0.1.0"
description = "ScanVault Python Intelligence Layer — OCR, Vision, AI services"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Image processing
    "opencv-python-headless>=4.10.0",
    "Pillow>=11.0.0",

    # OCR
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.0",

    # ML / AI
    "transformers>=4.48.0",
    "torch>=2.5.0",
    "sentence-transformers>=3.4.0",

    # Task queue
    "arq>=0.26.0",
    "redis>=5.2.0",

    # Object storage
    "boto3>=1.36.0",

    # Observability
    "prometheus-client>=0.21.0",

    # Utilities
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "numpy>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
