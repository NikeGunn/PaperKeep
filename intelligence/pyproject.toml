[project]
name = "scanvault-intelligence"
version = "0.1.0"
description = "ScanVault Python Intelligence Layer — OCR, Vision, AI services"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "mangum>=0.19.0",

    # Image processing
    "opencv-python-headless>=4.10.0",
    "Pillow>=11.0.0",
    "numpy>=2.2.0",

    # OCR (easyocr — cross-platform, no Windows build issues)
    "easyocr>=1.7.0",

    # Task queue
    "arq>=0.26.0",
    "redis>=5.2.0",

    # Object storage
    "boto3>=1.36.0",

    # Observability
    "prometheus-client>=0.21.0",

    # Utilities
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
