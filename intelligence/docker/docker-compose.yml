# Local development compose for the intelligence layer.
# Run from intelligence/ directory: docker compose -f docker/docker-compose.yml up
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-scanvault}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scanvault}
      - POSTGRES_DB=${POSTGRES_DB:-scanvault_intelligence}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanvault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8100:8100"
    environment:
      - RUNTIME_MODE=local
      - INTEL_REDIS_URL=redis://redis:6379/0
      - INTEL_DEBUG=true
      - INTEL_S3_BUCKET_NAME=${S3_BUCKET_NAME:-scanvault-staging-vault-203a9e83}
      - INTEL_AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - model-cache:/app/models
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      python -m arq src.workers.worker_main.WorkerSettings
    environment:
      - RUNTIME_MODE=local
      - INTEL_REDIS_URL=redis://redis:6379/0
      - INTEL_S3_BUCKET_NAME=${S3_BUCKET_NAME:-scanvault-staging-vault-203a9e83}
      - INTEL_AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - model-cache:/app/models
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  model-cache:
