name: Android CI

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-ci.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-ci.yml']

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Detekt, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle setup with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Detekt static analysis
        run: ./gradlew detekt
        working-directory: android

      - name: Lint (Android)
        run: ./gradlew lintDebug
        working-directory: android

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-debug.apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload lint & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports-${{ github.run_number }}
          path: android/**/build/reports/**
          retention-days: 14

  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle setup with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api${{ matrix.api-level }}-${{ runner.os }}

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          script: cd android && ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-results-api${{ matrix.api-level }}-${{ github.run_number }}
          path: android/**/build/reports/androidTests/**
          retention-days: 14

  release-build:
    name: Assemble Release (R8 + ProGuard gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle setup with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Assemble release (unsigned — signing gate is in android-release.yml)
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/dev/null \
            -Pandroid.injected.signing.store.password=unused \
            -Pandroid.injected.signing.key.alias=unused \
            -Pandroid.injected.signing.key.password=unused \
            --no-daemon
        working-directory: android
        continue-on-error: false

      - name: Verify APK exists
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Release APK: $APK"
          test -f "$APK"
