name: Android Release — GitHub + Play Store

# ─────────────────────────────────────────────────────────────────────────────
# One pipeline, two destinations:
#   1. GitHub Release  — always runs. Attaches the signed APK (+ AAB) so testers
#                        can side-load immediately.
#   2. Play Store      — runs ONLY when the Play secrets are configured. Until you
#                        have a Play Console account + service-account key, this
#                        step prints "coming soon" and the job stays GREEN.
#
# Trigger:
#   • push a tag  v2.0.0-alpha.1  → release that version
#   • or run manually (workflow_dispatch) and pick a track.
#
# Required secrets for full publishing (add later in repo Settings → Secrets):
#   RELEASE_KEYSTORE_BASE64          base64 of paperkeep-upload.jks
#   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#   PLAY_STORE_SERVICE_ACCOUNT_JSON  Play Console service-account JSON
# When RELEASE_KEYSTORE_BASE64 is absent the build falls back to an UNSIGNED
# release artifact so the pipeline is green from day one.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (only used once Play secrets exist)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout_percentage:
        description: 'Staged rollout % (production track only, 1-100)'
        required: false
        default: '10'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  release:
    name: Build, GitHub Release, (Play Store if configured)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Export Gradle Java home
        run: echo "ORG_GRADLE_JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # ── Detect which secrets are present (drives conditional steps) ──────────
      - name: Detect available secrets
        id: caps
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_PLAY: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          echo "has_keystore=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "has_play=$HAS_PLAY"         >> "$GITHUB_OUTPUT"
          echo "Keystore configured: $HAS_KEYSTORE"
          echo "Play Store configured: $HAS_PLAY"

      # ── Version info ─────────────────────────────────────────────────────────
      - name: Get version info
        id: version
        run: |
          VERSION=$(cat VERSION)
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing Paperkeep $VERSION (build $VERSION_CODE)"

      # ── Signing keystore (only if the secret exists) ─────────────────────────
      - name: Decode keystore
        if: steps.caps.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── Quality gates (same as CI) before we ship anything ───────────────────
      - name: Run unit tests (release variant)
        working-directory: android
        run: ./gradlew testReleaseUnitTest -x :core:ui:testReleaseUnitTest --no-daemon

      # ── Build artifacts ──────────────────────────────────────────────────────
      # When a keystore is present the build auto-signs (build.gradle.kts reads
      # keystore.properties). Without it, the artifacts are unsigned — fine for a
      # GitHub pre-release, NOT acceptable for Play Store (gated below anyway).
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build release APK (side-loading / QA)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate artifacts
        id: artifacts
        run: |
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          # Prefer a signed APK; fall back to whatever exists so we can fail loudly below.
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -1)
          [ -z "$APK" ] && APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "AAB: $AAB"
          echo "APK: $APK"
          test -f "$APK"
          # Guard: when a keystore secret is configured, the release APK MUST be signed.
          # An unsigned APK installs nowhere ("package appears to be invalid") — never ship it.
          if [ "${{ steps.caps.outputs.has_keystore }}" = "true" ]; then
            case "$APK" in
              *-unsigned.apk)
                echo "::error title=Unsigned APK::Keystore secret is set but assembleRelease produced an UNSIGNED APK ($APK). Check the keystore secrets — refusing to publish."
                exit 1
                ;;
            esac
            echo "Release APK is signed: $APK"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperkeep-release-${{ steps.version.outputs.name }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperkeep-release-${{ steps.version.outputs.name }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload R8 mapping (deobfuscation — keep forever per reference.md)
        if: steps.caps.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paperkeep-mapping-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      # ── Release notes (use the store file if present, else a default) ────────
      - name: Resolve release notes
        id: notes
        run: |
          NOTES_FILE="android/store/release-notes-${{ steps.version.outputs.name }}.txt"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using $NOTES_FILE"
            cp "$NOTES_FILE" /tmp/release-notes.txt
          else
            echo "Paperkeep ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})" > /tmp/release-notes.txt
          fi
          {
            echo ""
            echo "---"
            if [ "${{ steps.caps.outputs.has_keystore }}" = "true" ]; then
              echo "✅ Signed release. Attached APK is ready to install."
            else
              echo "⚠️ UNSIGNED build (no release keystore secret configured yet)."
            fi
            if [ "${{ steps.caps.outputs.has_play }}" = "true" ]; then
              echo "📦 Also published to Google Play (${{ github.event.inputs.track || 'internal' }} track)."
            else
              echo "🟡 Google Play publishing: **coming soon** — Play Console account not connected yet."
            fi
          } >> /tmp/release-notes.txt

      # ── GitHub Release — ALWAYS runs ─────────────────────────────────────────
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: Paperkeep ${{ steps.version.outputs.name }}
          body_path: /tmp/release-notes.txt
          prerelease: ${{ contains(steps.version.outputs.name, 'alpha') || contains(steps.version.outputs.name, 'beta') }}
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          fail_on_unmatched_files: false

      # ── Play Store — gated. Prints "coming soon" until secrets exist ─────────
      - name: Google Play — coming soon (no Play secrets configured)
        if: steps.caps.outputs.has_play != 'true'
        run: |
          echo "::notice title=Play Store::Google Play publishing is COMING SOON."
          echo "No PLAY_STORE_SERVICE_ACCOUNT_JSON secret found — skipping upload."
          echo "To enable: create a Play Console account, add a service-account key as"
          echo "the PLAY_STORE_SERVICE_ACCOUNT_JSON secret (and the keystore secrets),"
          echo "then re-run this workflow. The job stays green in the meantime."

      - name: Set up Ruby (for Fastlane)
        if: steps.caps.outputs.has_play == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Install Fastlane
        if: steps.caps.outputs.has_play == 'true'
        run: |
          cat > android/Gemfile <<'EOF'
          source "https://rubygems.org"
          gem "fastlane"
          EOF
          bundle install --gemfile=android/Gemfile

      - name: Decode Google Play service account key
        if: steps.caps.outputs.has_play == 'true'
        run: echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" > /tmp/play-store-key.json

      - name: Determine upload track
        if: steps.caps.outputs.has_play == 'true'
        id: track
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "track=internal" >> "$GITHUB_OUTPUT"
            echo "rollout=1" >> "$GITHUB_OUTPUT"
          else
            echo "track=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "rollout=${{ github.event.inputs.rollout_percentage }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Play Store (${{ steps.track.outputs.track }})
        if: steps.caps.outputs.has_play == 'true'
        working-directory: android
        env:
          SUPPLY_JSON_KEY: /tmp/play-store-key.json
          SUPPLY_PACKAGE_NAME: app.paperkeep
          SUPPLY_TRACK: ${{ steps.track.outputs.track }}
        run: |
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          bundle exec fastlane supply \
            --aab "$AAB_PATH" \
            --track "$SUPPLY_TRACK" \
            --json_key "$SUPPLY_JSON_KEY" \
            --package_name "$SUPPLY_PACKAGE_NAME" \
            --rollout "${{ steps.track.outputs.rollout }}"

      - name: Clean up secrets
        if: always()
        run: rm -f android/app/release.keystore android/keystore.properties /tmp/play-store-key.json

      - name: Summary
        if: always()
        run: |
          {
            echo "## Paperkeep ${{ steps.version.outputs.name }} release"
            echo "- GitHub Release: ✅ created with APK/AAB attached"
            if [ "${{ steps.caps.outputs.has_play }}" = "true" ]; then
              echo "- Google Play: ✅ uploaded (${{ steps.track.outputs.track }} track)"
            else
              echo "- Google Play: 🟡 coming soon (no Play secrets yet)"
            fi
            if [ "${{ steps.caps.outputs.has_keystore }}" != "true" ]; then
              echo "- ⚠️ Build was UNSIGNED (add RELEASE_KEYSTORE_BASE64 to sign)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
