name: Intelligence Deploy (AWS Lambda)

on:
  push:
    branches: [main]
    paths: ['intelligence/**', '.github/workflows/intelligence-deploy-aws.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: intelligence-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-push:
    name: Build arm64 Python image → ECR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (arm64 support)
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64 image
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ENV: ${{ github.event.inputs.environment || 'staging' }}
        run: |
          REPO="${ECR_REGISTRY}/scanvault-${ENV}-python-intelligence"
          docker buildx build \
            --platform linux/arm64 \
            --file intelligence/docker/Dockerfile \
            --build-arg RUNTIME_MODE=lambda \
            --tag "${REPO}:${IMAGE_TAG}" \
            --tag "${REPO}:latest" \
            --push \
            intelligence/
          echo "image-uri=${REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Update staging Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == ''
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name scanvault-staging-python-intelligence \
            --image-uri "${{ needs.build-and-push.outputs.image-uri }}" \
            --architectures arm64 \
            --region ${{ env.AWS_REGION }}

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name scanvault-staging-python-intelligence \
            --region ${{ env.AWS_REGION }}

  deploy-production:
    name: Update production Lambda (manual gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    if: github.event.inputs.environment == 'production'
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name scanvault-production-python-intelligence \
            --image-uri "${{ needs.build-and-push.outputs.image-uri }}" \
            --architectures arm64 \
            --region ${{ env.AWS_REGION }}

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name scanvault-production-python-intelligence \
            --region ${{ env.AWS_REGION }}
