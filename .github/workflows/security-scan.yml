name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC — weekly
  pull_request:
    paths: ['android/**', '.github/workflows/security-scan.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/security-scan.yml']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: paperkeep-android
          path: android
          format: SARIF
          out: reports
          # Fail the job if any CRITICAL or HIGH CVEs are found
          args: --failOnCVSS 7

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif

      - name: Upload full OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

  secrets-scan:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secrets scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog secrets scan (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

      - name: TruffleHog secrets scan (schedule/dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  detekt-security:
    name: Detekt (security rules gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Export Gradle Java home
        run: echo "ORG_GRADLE_JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Gradle setup with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detekt
        working-directory: android

      - name: Check for android.util.Log.* in release source
        run: |
          # Policy: no direct android.util.Log in app code. The only sanctioned
          # logger is DebugLog (core/common), which is FLAG_DEBUGGABLE-gated and
          # stripped in release via -assumenosideeffects. So we ban the bare
          # `Log.<level>(` API while allowing DebugLog.<level>( calls and the
          # DebugLog.kt wrapper itself (the one place real Log.* is permitted).
          MATCHES=$(grep -rnE "(^|[^a-zA-Z])Log\.(d|w|e|i|v|wtf)\(" \
            android/app/src/main android/core/*/src/main android/feature/*/src/main 2>/dev/null \
            | grep -v "//.*Log\." \
            | grep -v "/DebugLog.kt:" || true)
          COUNT=$(printf '%s' "$MATCHES" | grep -c . || true)
          echo "Direct android.util.Log.* calls in release source: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "ERROR: direct Log.* found in release source (use DebugLog instead — banned by security policy):"
            printf '%s\n' "$MATCHES"
            exit 1
          fi

      - name: Check for hardcoded secrets patterns
        run: |
          # Scan for common secret patterns in source (not in .git or build dirs)
          if grep -rn \
            -e 'password\s*=\s*"[^"]\+"\|api_key\s*=\s*"[^"]\+"\|secret\s*=\s*"[^"]\+"\|token\s*=\s*"[^"]\+"' \
            --include="*.kt" --include="*.java" --include="*.gradle.kts" \
            android/ 2>/dev/null | grep -v "/build/" | grep -v "Test" | grep -v "//"; then
            echo "ERROR: Possible hardcoded secrets found. Review the above lines."
            exit 1
          fi
          echo "No hardcoded secret patterns found."
