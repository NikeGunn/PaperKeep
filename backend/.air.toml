# air — Go hot-reload config for ScanVault backend
# Docs: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # Command to rebuild
  cmd = "go build -o ./tmp/api ./cmd/api"
  # Binary to run
  bin = "./tmp/api"
  # Watch these file extensions
  include_ext = ["go", "toml", "env", "sql"]
  # Ignore these directories
  exclude_dir = ["tmp", "vendor", "testdata", "build"]
  # Exclude files
  exclude_file = []
  # Ignore unchanged files (faster reloads)
  exclude_unchanged = true
  # Follow symlinks
  follow_symlink = true
  # Delay before rebuilding after change (ms)
  delay = 500
  # Kill old binary before restarting
  kill_delay = "500ms"
  # Send interrupt signal before kill
  send_interrupt = true
  # Rerun on failure
  rerun = false
  # Stop on error
  stop_on_error = false
  # Args to pass to the binary
  args_bin = []

[log]
  time = true
  main_only = false

[color]
  main     = "magenta"
  watcher  = "cyan"
  build    = "yellow"
  runner   = "green"

[screen]
  clear_on_rebuild = false
  keep_scroll = true
