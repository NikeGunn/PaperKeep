# ScanVault Backend — golangci-lint strict configuration
# Run: golangci-lint run ./...
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  go: "1.23"
  # Don't use the build cache — always lint clean
  allow-parallel-runners: false

output:
  # Show file:line:col for every issue
  formats:
    - format: colored-line-number
  sort-results: true

linters-settings:
  errcheck:
    # Check all type assertions and error returns, even in defer/go statements
    check-type-assertions: true
    check-blank: true

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
    disabled-checks:
      # These fire too aggressively on idiomatic Go
      - hugeParam
      - rangeValCopy

  gosec:
    # Audit all security findings
    excludes: []
    config:
      G101:
        # Minimum entropy for hardcoded credential detection
        pattern: "(?i)passwd|pass|password|pwd|secret|token|pw|apikey|bearer|cred"
        ignore_entropy: false
        entropy_threshold: "80.0"
        per_char_threshold: "3.0"

  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
      - name: var-naming
      - name: unused-parameter
      - name: unreachable-code
      - name: superfluous-else
      - name: indent-error-flow
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: empty-block
      - name: context-as-argument
      - name: context-keys-type

  gofumpt:
    # Enforce stricter gofumpt formatting
    module-path: github.com/nikhil/scanvault-api
    extra-rules: true

  goconst:
    # Report strings that appear ≥3 times (make them constants)
    min-len: 3
    min-occurrences: 3

  gosimple:
    checks: ["all"]

  staticcheck:
    checks: ["all"]

  gocyclo:
    # Maximum cyclomatic complexity per function
    min-complexity: 15

  govet:
    enable-all: true
    disable:
      # Too noisy in tests
      - fieldalignment

  misspell:
    locale: US

  nolintlint:
    # Require specific linter name in //nolint:lintername comments
    require-specific: true
    allow-no-explanation: []
    require-explanation: true

linters:
  # Disable default linters set, then enable explicitly
  disable-all: true
  enable:
    # Error handling
    - errcheck
    - errorlint

    # Security
    - gosec

    # Style & correctness
    - gocritic
    - revive
    - govet
    - gofumpt
    - goconst
    - gosimple
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    # Additional quality linters
    - gocyclo
    - misspell
    - nolintlint
    - unconvert
    - unparam
    - wastedassign

issues:
  # Max issues to report (0 = unlimited)
  max-issues-per-linter: 0
  max-same-issues: 0

  # Don't exclude any issues by default
  exclude-use-default: false

  # Files/paths to exclude from linting
  exclude-dirs:
    - vendor
    - .git

  exclude-files:
    - ".*_mock\\.go$"
    - ".*\\.pb\\.go$"

  # Per-linter exclusions for known false-positives
  exclude-rules:
    # errcheck: Allow error returns to be ignored in defers (common pattern)
    - path: ".*_test\\.go"
      linters:
        - gosec
        - goconst
        - unparam

    # Allow unused parameters in interface implementations
    - linters:
        - unparam
      text: "always receives"
