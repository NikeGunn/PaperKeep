# Local development stack for ScanVault backend.
# Usage:
#   docker compose up -d          — start everything
#   docker compose down           — stop (data persists in volume)
#   docker compose down -v        — stop AND wipe data (fresh init on next up)
#
# DATABASE_URL for backend/.env:
#   postgres://scanvault:scanvault@localhost:5432/scanvault?sslmode=disable
# REDIS_URL:
#   redis://localhost:6379

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanvault
      POSTGRES_PASSWORD: scanvault
      POSTGRES_DB: scanvault
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanvault -d scanvault"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  postgres_data:
    driver: local
